name: brainbox_mobile
description: BrAInBox - AI study app for G.C.E. A/L Biology students (Android).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  brainbox_core:
    path: ../../packages/brainbox_core
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^18.1.0
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  shared_preferences: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.2.0
  image_picker: ^1.2.4
  camera: ^0.12.1
  file_picker: ^13.1.0
  flutter_markdown_plus: ^1.0.12
  photo_view: ^0.15.0
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/illustrations/
