# Android launcher icon (adaptive on Android 8+).
# Regenerate with `melos run brand:generate` (or `dart run flutter_launcher_icons`
# in apps/mobile) after changing anything in assets/brand/. Commit the output.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app_icon_1024.png"
  adaptive_icon_foreground: "assets/brand/adaptive_foreground_1024.png"
  adaptive_icon_background: "assets/brand/adaptive_background_1024.png"
  # The brand foreground is already sized to the adaptive-icon safe zone,
  # so no extra inset (the default 16% would shrink the logo).
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
