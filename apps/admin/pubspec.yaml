name: brainbox_admin
description: BrAInBox Admin - web portal for syllabus, content, questions and moderation.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  brainbox_core:
    path: ../../packages/brainbox_core
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^18.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  file_picker: ^13.1.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true
