name: Flutter CI

# Runs on every PR into develop or main, and after merges into main.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.x"

jobs:
  checks:
    name: Analyze, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      # Also creates the stub firebase_options.dart in each app (no secrets).
      - name: melos bootstrap
        run: melos bootstrap

      # Before `gen`, so generated files (git-ignored) are not checked.
      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Generate code (freezed / json / riverpod)
        run: melos run gen

      - name: Analyze
        run: melos run analyze

      - name: Run tests
        run: melos run test

      - name: Build admin web
        run: melos run build:web

      - name: Upload admin web build
        uses: actions/upload-artifact@v7
        with:
          name: brainbox-admin-web
          path: apps/admin/build/web
          retention-days: 7

      # The APK is only built for PRs into main and pushes to main.
      - name: Set up Java (for the Android build)
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: melos run build:apk

      - name: Upload APK
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: brainbox-mobile-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
