name: brainbox_core
description: Shared models, API client, auth, theme and widgets for the BrAInBox apps.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  dio: ^5.11.1
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  google_fonts: ^8.2.1
  json_annotation: ^4.11.0
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3

flutter:
  assets:
    - assets/logo/
