# Workspace root for the BrAInBox frontend.
#
# This file only lists the packages in the workspace and holds the Melos
# config (Melos 7+ reads its config from here; there is no melos.yaml).
# App dependencies live in each package's own pubspec.yaml.
name: brainbox_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/brainbox_core
  - apps/mobile
  - apps/admin

dev_dependencies:
  # 7.8.x: flutter_launcher_icons 0.14 needs cli_util 0.4, which melos 8 no longer allows.
  melos: ^7.8.1

melos:
  name: brainbox

  # Melos would otherwise generate IntelliJ run configs; we don't commit those.
  ide:
    intellij:
      enabled: false

  command:
    bootstrap:
      hooks:
        # Creates lib/firebase_options.dart from the .example stub in each app
        # if it does not exist yet, so the apps compile before Firebase is set up.
        post: dart run tool/ensure_firebase_options.dart

  # Scripts use `melos exec` with filters (not `packageFilters`) so they never
  # stop to ask "which package?" - that prompt breaks CI.
  scripts:
    analyze:
      description: Analyze every package (fails on any error, warning or info).
      run: melos exec -- flutter analyze --fatal-infos .

    format:
      description: Format all Dart code in the repo.
      run: dart format .

    format:check:
      description: Fail if any Dart file is not formatted (used by CI).
      run: dart format --set-exit-if-changed .

    gen:
      description: Generate freezed / json_serializable / riverpod code.
      run: melos exec --depends-on=build_runner -- dart run build_runner build

    gen:watch:
      description: Same as gen, but keeps watching for changes.
      run: melos exec --depends-on=build_runner -- dart run build_runner watch

    test:
      description: Run unit and widget tests in every package that has a test/ folder.
      run: melos exec --dir-exists=test -- flutter test

    build:apk:
      description: Build the student Android app (debug APK).
      run: melos exec --scope=brainbox_mobile -- flutter build apk --debug

    build:web:
      description: Build the admin portal for the web.
      run: melos exec --scope=brainbox_admin -- flutter build web

    brand:generate:
      description: Regenerate the Android launcher icon and native splash from apps/mobile/assets/brand (commit the result).
      run: melos exec --scope=brainbox_mobile -- "dart run flutter_launcher_icons && dart run flutter_native_splash:create"
